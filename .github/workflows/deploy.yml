name: Deploy (üretim)

# YALNIZ ELLE tetiklenir (Actions → "Deploy (üretim)" → Run workflow). push/PR ile ASLA koşmaz.
# Akış: imajları derle → GHCR'a it (etiket = commit SHA) → sunucuya SSH ile bağlan →
# `infra/ops/deploy.sh <sha>` (çek, migrate, başlat, sağlık bekle). Ayrıntı: docs/deploy.md.
#
# Gerekli GitHub ayarları (Settings → Environments → "production"; gerçek değerler depoya girmez):
#   secrets.DEPLOY_HOST         sunucu adı ya da IP
#   secrets.DEPLOY_USER         SSH kullanıcısı (docker grubunda, sudo'suz)
#   secrets.DEPLOY_SSH_KEY      o kullanıcının özel anahtarı (yalnız bu iş için üretilmiş ed25519)
#   secrets.DEPLOY_KNOWN_HOSTS  `ssh-keyscan -t ed25519 <host>` çıktısı (MITM'e karşı sabitleme)
#   vars.DEPLOY_PATH            depo kopyasının sunucudaki yolu (varsayılan /opt/aegis)
# GHCR'a itme GITHUB_TOKEN ile yapılır (packages: write). Sunucu imajları kendi salt-okunur
# jetonuyla çeker (`docker login ghcr.io`, bir kez) — bu iş sunucuya jeton taşımaz.
# "production" ortamına zorunlu onaylayıcı eklenmesi önerilir.

on:
  workflow_dispatch:
    inputs:
      onay:
        description: "Üretime dağıtmak için DAGIT yazın"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    name: İmaj derle + GHCR'a it (${{ matrix.image }})
    if: inputs.onay == 'DAGIT'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [api, worker, web]
    steps:
      - uses: actions/checkout@v7
      - name: Kayıt adı (GHCR küçük harf ister)
        id: reg
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: ${{ steps.reg.outputs.prefix }}/aegis-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Sunucuya dağıt
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/aegis' }}
    steps:
      - name: Sırlar tanımlı mı
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          eksik=0
          for ad in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!ad}" ]; then echo "::error::$ad tanımlı değil (production ortamı)"; eksik=1; fi
          done
          exit "$eksik"
      - name: SSH anahtarı
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Dağıt (git checkout + infra/ops/deploy.sh)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; cd '$DEPLOY_PATH' && git fetch --quiet origin '$GITHUB_SHA' && git checkout --quiet --detach '$GITHUB_SHA' && infra/ops/deploy.sh '$GITHUB_SHA'"
      - name: Anahtarı sil
        if: always()
        run: rm -f ~/.ssh/deploy_key

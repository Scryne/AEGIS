[project]
name = "aegis-api"
version = "0.0.0"
description = "AEGIS API — FastAPI (async): kimlik, kiracı çözümleme, RBAC, OpenAPI."
requires-python = ">=3.12"
dependencies = [
    "aegis-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "email-validator>=2.2.0",
    # Yalnız ÜRETİCİ olarak: API, derin tarama gibi işleri ada göre kuyruğa atar
    # (``send_task``) — worker kodunu asla import etmez (bkz. aegis_core.queueing).
    "celery[redis]>=5.4.0",
]

[tool.uv.sources]
aegis-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_api"]

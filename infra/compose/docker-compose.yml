name: aegis

# api/worker: RLS'ye TABİ non-superuser rol (aegis_app).
# migrate: ayrıcalıklı owner/superuser rol (aegis). Bkz. ADR-0002.
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://aegis_app:aegis_app@postgres:5432/aegis
  REDIS_URL: redis://redis:6379/0
  # Tarama motoru (E1.3): self-host yente — KVKK gereği PII dışarı çıkmaz.
  # `aegis_all`, manifest'te tanımlı birleşik kapsamdır (OpenSanctions + MASAK).
  YENTE_URL: http://yente:8000
  YENTE_DATASET: aegis_all
  # Belge deposu (E1.4): belgeler veritabanında DEĞİL, nesne deposunda tutulur —
  # DB yedeği PII taşıyan PDF'leri sürüklemesin, saklama süresi imhası dosyayı ayrı
  # silebilsin (Invariant 4).
  OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
  OBJECT_STORAGE_BUCKET: aegis-documents
  OBJECT_STORAGE_ACCESS_KEY_ID: aegis
  OBJECT_STORAGE_SECRET_ACCESS_KEY: aegis-minio-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-uyumlu nesne depolama (E1.4 belge yükleme). Konsol: http://localhost:9001
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aegis
      MINIO_ROOT_PASSWORD: aegis-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Migration'ları çalıştırıp çıkan tek seferlik servis (ayrıcalıklı rol).
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:aegis@postgres:5432/aegis
      DATABASE_ADMIN_URL: postgresql+psycopg://aegis:aegis@postgres:5432/aegis
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: ../../.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      <<: *app-env
      # Web istekleri Next proxy'sinden gelir; X-Forwarded-For'un sondan 1 girdisi güvenilir.
      TRUSTED_PROXY_COUNT: "1"
    env_file:
      - path: ../../.env
        required: false
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      <<: *app-env
      # Günlük sanctions.sync job'ı MASAK FtM dosyasını buraya yazar; yente aynı
      # hacmi salt-okunur bağlar (bkz. yente servisi).
      MASAK_ENTITIES_PATH: /manifests/masak/entities.ftm.json
    env_file:
      - path: ../../.env
        required: false
    volumes:
      - masakdata:/manifests/masak
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # NEXT_PUBLIC_API_URL build anında gömülür (tarayıcı host'tan erişir → localhost).
  # API_URL çalışma anında sunucu tarafı proxy (/api/v1/[...path]) içindir.
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # ── Tarama motoru (E1.3) — `--profile screening` ile başlatılır ──────────────
  # Varsayılan `up` bunları BAŞLATMAZ: ES ~4GB heap ister ve her geliştirme oturumu
  # tarama gerektirmez (bkz. CLAUDE.md — 4–16GB RAM + 10–30GB disk). Sürümler
  # yente 5.5.0'ın kendi compose'undan pinlendi.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    profiles: ["screening"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms4g -Xmx4g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    # Heap 4g; konteynere heap + off-heap + Lucene için pay bırakılır. Sınır YOKSA
    # tek host'ta (R6: Kubernetes yok) ES, Postgres'i OOM'a sürükleyebilir.
    deploy:
      resources:
        limits:
          memory: 6g
        reservations:
          memory: 5g
    restart: unless-stopped
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s --fail http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  yente:
    image: ghcr.io/opensanctions/yente:5.5.0
    profiles: ["screening"]
    environment:
      YENTE_INDEX_TYPE: elasticsearch
      YENTE_INDEX_URL: http://elasticsearch:9200
      # Manifest: OpenSanctions + MASAK dondurma listesi → birleşik `aegis_all` kapsamı.
      YENTE_MANIFEST: /manifests/manifest.yml
      # AÇIK olmalı — kapalıyken yente İLK indekslemeyi de atlar: indeks hiç oluşmaz ve
      # /readyz sonsuza kadar 503 döner (değerlendirme ortamında doğrulandı).
      YENTE_AUTO_REINDEX: "true"
      # Yeniden indekslemeyi bizim günlük job'ımız tetikler (sanctions.sync); jeton
      # .env'den gelir. Boşsa yente kendi zamanlayıcısıyla yenilenir.
      YENTE_UPDATE_TOKEN: ${YENTE_UPDATE_TOKEN:-}
      # KVKK: sorgu içerikleri dışarı gönderilmez.
      YENTE_STATEMENT_API: "false"
    env_file:
      - path: ../../.env
        required: false
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
    ports:
      - "8001:8000"
    volumes:
      - ../yente/manifest.yml:/manifests/manifest.yml:ro
      # MASAK FtM dosyası: worker YAZAR, yente OKUR (aynı adlandırılmış hacim).
      - masakdata:/manifests/masak
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s --fail http://localhost:8000/healthz || exit 1"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  esdata:
  masakdata:

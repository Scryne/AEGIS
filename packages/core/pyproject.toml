[project]
name = "aegis-core"
version = "0.0.0"
description = "AEGIS çekirdek kütüphanesi — db, modeller, güvenlik, servisler (paylaşılan)."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "structlog>=24.4.0",
    "pyjwt>=2.10.0",
    "pwdlib[argon2]>=0.2.1",
    "redis>=5.2.0",
    "sentry-sdk>=2.19.0",
    "cryptography>=44",
    # yente (tarama motoru) + GLEIF istemcisi — async (API) + senkron (worker).
    "httpx>=0.28.0",
    # S3-uyumlu nesne deposu (MinIO) — belge saklama (E1.4).
    "boto3>=1.35.0",
    "jinja2>=3.1.4",
    "xhtml2pdf>=0.2.17",
    "python-docx>=1.1.2",
]
# Not: Docling (belge çıkarımı) bilinçli olarak BURADA DEĞİLDİR. PyTorch dahil ~2 GB'lık
# bir ağaç getirir; zorunlu bağımlılık olsaydı CI her koşuda onu çözerdi. Kök
# pyproject'teki `extraction` bağımlılık grubundadır ve yalnız worker imajına kurulur
# (bkz. aegis_core/documents/docling_adapter.py modül başlığı).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_core"]

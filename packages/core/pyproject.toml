[project]
name = "aegis-core"
version = "0.0.0"
description = "AEGIS çekirdek kütüphanesi — db, modeller, güvenlik, servisler (paylaşılan)."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "structlog>=24.4.0",
    "pyjwt>=2.10.0",
    "pwdlib[argon2]>=0.2.1",
    "redis>=5.2.0",
    "sentry-sdk>=2.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_core"]

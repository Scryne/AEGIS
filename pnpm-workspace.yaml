packages:
  - "apps/web"

# Kurulum (postinstall) script'lerine izin verilen paketler (pnpm 11 varsayılan
# olarak hepsini bloklar).
allowBuilds:
  sharp: true
  unrs-resolver: true

# NOT: OpenAPI→TS tip-güvenli istemci (packages/api-client) ve sözleşme-drift kapısı
# API yüzeyi büyüdüğünde (E1.3+) eklenecektir; E1.1 web kabuğu aynı-origin /api/v1
# proxy'si üzerinden düz fetch kullanır.

# Geçişli geliştirme bağımlılıkları (eslint, tailwind/postcss altı) için güvenlik tabanı.
# 2026-09-26 denetimi: brace-expansion, js-yaml, nanoid, postcss yüksek/orta açıklar.
overrides:
  brace-expansion@<1.1.18: 1.1.18
  js-yaml@>=4 <4.3.2: 4.3.2
  nanoid@<3.3.18: 3.3.18
  postcss@<8.5.23: 8.5.23
  # 2026-10-26 denetimi: next'in getirdiği sharp (librsvg, GHSA-wq5f-xc86-pv6w) ve postcss altı
  # source-map-js (DoS, GHSA-68fv-2mgg-jv7q).
  sharp@<0.35.5: 0.35.5
  source-map-js@<1.2.2: 1.2.2

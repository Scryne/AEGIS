[project]
name = "aegis"
version = "0.0.0"
description = "AEGIS — KYB / kurumsal due diligence platformu (monorepo kökü)"
requires-python = ">=3.12"
dependencies = [
    "aegis-core",
    "aegis-api",
    "aegis-worker",
]

# Kök, kurulabilir bir paket değildir; yalnızca workspace çapasıdır (virtual project).
[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "apps/api", "apps/worker"]

[tool.uv.sources]
aegis-core = { workspace = true }
aegis-api = { workspace = true }
aegis-worker = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.27.0",
    "testcontainers[postgres]>=4.8.0",
]

# ── Ruff (lint + format) ─────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "C4", "PT", "SIM", "RUF"]
# RUF001-003: Türkçe metindeki "ambiguous unicode" uyarıları (ı, İ, ş, ç...) —
# proje dili Türkçe olduğundan bilinçli olarak kapatıldı.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["aegis_core", "aegis_api", "aegis_worker"]

[tool.ruff.lint.per-file-ignores]
# S608: izolasyon testi tablo adlarını sabit bir demetten f-string ile geçirir
# (kullanıcı girdisi yok); RLS'i her tabloda aynı iddiayla sınamanın tek yolu bu.
"**/tests/**" = ["S101", "S105", "S106", "S608"]
"**/conftest.py" = ["S105", "S106"]
"migrations/**" = ["E501"]
# evals/ de test dizinidir (recall kapısı), yalnız adı "tests" değil.
"evals/**" = ["S101"]

# ── Mypy (strict) ────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages/core/src", "apps/api/src", "apps/worker/src"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
]
ignore_missing_imports = true

# Celery'nin @task dekoratörü tipsizdir; task modüllerinde bu kuralı gevşetiriz.
[[tool.mypy.overrides]]
module = ["aegis_worker.tasks.*"]
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps", "evals"]
# Varsayılan koşu: hızlı katman. Docker gerektiren kapılar kendi işaretleriyle ayrı
# koşar (integration: Postgres/Redis; screening: yente + Elasticsearch).
addopts = "-q --strict-markers --import-mode=importlib -m 'not integration and not screening'"
# Tek bir test asılı kalırsa koşuyu saatlerce bloke etmesin.
timeout = 300
timeout_method = "thread"
markers = [
    "integration: gerçek servis (Docker/testcontainers) gerektiren testler",
    "screening: gerçek yente + Elasticsearch gerektiren uçtan uca recall kapısı (E1.3)",
]
